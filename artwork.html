<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork - Kathryn Maple</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="artwork-styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="artist-name">Kathryn Maple</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Pictures</a></li>
                    <li><a href="exhibitions.html">Exhibitions</a></li>
                    <li><a href="biography.html">Biography</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="artwork-detail">
        <div class="container">
            <div class="artwork-layout">
                <div class="artwork-content-left">
                    <h2 class="artwork-title-large" id="artwork-title">Artwork Title</h2>
                    <div class="artwork-description" id="artwork-description">
                        <p class="artwork-meta">Medium</p>
                        <p class="artwork-meta">Dimensions</p>
                        <p class="artwork-meta">Year</p>
                    </div>

                    <div class="artwork-actions">
                        <button class="btn-enquire">Enquire</button>
                        <button class="btn-share">
                            Share
                            <svg class="share-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                        </button>
                    </div>

                    <div class="further-images-thumbnails" id="further-thumbnails">
                        <!-- Thumbnails will be dynamically loaded here -->
                    </div>
                </div>

                <div class="artwork-content-right">
                    <div class="artwork-image-container">
                        <img id="main-artwork-image" src="" alt="Artwork">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Enquire Modal -->
    <div id="enquire-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="close-modal">&times;</button>
            <h2 class="modal-title">Enquire</h2>
            <p class="modal-subtitle" id="modal-artwork-title">Artwork Title</p>

            <form id="enquire-form">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>

                <button type="submit" class="btn-submit">Send Enquiry</button>
            </form>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="modal">
        <div class="modal-content share-modal-content">
            <button class="modal-close" id="close-share-modal">&times;</button>
            <h2 class="modal-title">Share</h2>

            <div class="share-options">
                <button class="share-option" id="share-facebook">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    Facebook
                </button>

                <button class="share-option" id="share-twitter">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                    </svg>
                    Twitter
                </button>

                <button class="share-option" id="share-email">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    Email
                </button>

                <button class="share-option" id="share-copy">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copy Link
                </button>
            </div>
        </div>
    </div>

    <script src="logo-animation.js"></script>
    <script src="artwork.js"></script>
</body>
</html>
